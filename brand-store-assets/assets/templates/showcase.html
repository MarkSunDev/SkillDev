<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=__VIEWPORT_W__, height=__VIEWPORT_H__, initial-scale=1">
<title>Brand showcase</title>
<style>
@font-face{font-family:"Instrument Serif";src:url("../fonts/InstrumentSerif-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Instrument Serif";src:url("../fonts/InstrumentSerif-Italic.ttf") format("truetype");font-weight:400;font-style:italic;font-display:block}
@font-face{font-family:"Public Sans";src:url("../fonts/PublicSans.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
:root{--font-headline:"Instrument Serif","Songti SC",serif;--font-body:"Public Sans","PingFang SC",sans-serif}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:#111;color:var(--ink);font-family:var(--font-body)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.veil{position:absolute;inset:0;background:
  linear-gradient(90deg,rgba(0,0,0,var(--scrim)) 0%,rgba(0,0,0,calc(var(--scrim) * .55)) 42%,transparent 72%),
  linear-gradient(0deg,rgba(0,0,0,calc(var(--scrim) * .7)) 0%,transparent 55%)}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:soft-light;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.6'/></svg>");
  background-size:180px 180px}
.top{position:absolute;left:78px;right:78px;top:62px;display:flex;align-items:center;justify-content:space-between;gap:30px}
.brand{display:flex;align-items:center;gap:16px}
.brand .mark{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
.brand .mark svg,.brand .mark img{display:block;width:100%;height:100%;object-fit:contain}
.brand .name{font-size:15px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;white-space:nowrap}
.micro{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;opacity:.55;white-space:nowrap}
.hero{position:absolute;left:78px;bottom:150px;display:flex;align-items:flex-end;gap:54px}
.hero .mark{width:360px;height:360px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.hero .mark svg,.hero .mark img{display:block;width:100%;height:100%;object-fit:contain}
.copy{padding-bottom:8px;max-width:720px}
.copy h1{font-family:var(--font-headline);font-weight:400;font-size:104px;line-height:.94;letter-spacing:-.02em;margin:0;white-space:nowrap}
.copy p{font-size:25px;line-height:1.3;margin:22px 0 0;opacity:.78;max-width:560px}
.rule{width:52px;height:3px;background:var(--accent);margin-bottom:26px}
.meta{position:absolute;right:78px;bottom:150px;text-align:right}
.chips{display:flex;gap:10px;justify-content:flex-end;margin-bottom:16px}
.chip{width:42px;height:42px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.meta .label{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.55}
.footer{position:absolute;left:78px;right:78px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;opacity:.42}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="photo" id="photo" alt="">
  <div class="veil" id="veil"></div>
  <div class="grain"></div>

  <div class="top">
    <div class="brand">
      <div class="mark" id="topMark"></div>
      <div class="name" id="topName"></div>
    </div>
    <div class="micro" id="topMicro"></div>
  </div>

  <div class="hero">
    <div class="mark" id="heroMark"></div>
    <div class="copy">
      <div class="rule"></div>
      <h1 id="title"></h1>
      <p id="tagline"></p>
    </div>
  </div>

  <div class="meta">
    <div class="chips" id="chips"></div>
    <div class="label" id="metaLabel"></div>
  </div>

  <div class="footer">
    <span id="footerLeft"></span>
    <span>Showcase · not a store asset</span>
  </div>
</div>
<script>
window.__DATA__ = __DATA_JSON__;
(function () {
  const D = window.__DATA__;
  const root = document.documentElement;
  root.style.setProperty("--ink", D.ink || "#F7F4ED");
  root.style.setProperty("--accent", D.accent || "#D7EA8E");
  root.style.setProperty("--scrim", String(Number(D.scrim) || 0.35));
  document.getElementById("photo").src = D.backdrop;
  document.getElementById("topName").textContent = D.name || "App";
  document.getElementById("topMicro").textContent = D.micro || "BRAND MARK / 01";
  document.getElementById("title").textContent = D.name || "App";
  document.getElementById("tagline").textContent = D.tagline || "";
  if (!D.tagline) document.getElementById("tagline").style.display = "none";
  document.getElementById("metaLabel").textContent = D.meta_label || "FIELD · INK · ACCENT";
  document.getElementById("footerLeft").textContent = D.footer || "Identity system";

  const topMark = document.getElementById("topMark");
  const heroMark = document.getElementById("heroMark");
  if (D.logo_svg) {
    topMark.innerHTML = D.logo_svg;
    heroMark.innerHTML = D.logo_svg;
  } else if (D.logo_url) {
    [topMark, heroMark].forEach(function (node) {
      const img = document.createElement("img");
      img.src = D.logo_url;
      img.alt = "";
      node.appendChild(img);
    });
  }

  const chips = document.getElementById("chips");
  [D.field, D.ink, D.accent].forEach(function (color) {
    if (!color) return;
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.style.background = color;
    chips.appendChild(chip);
  });

  function fit(el, maxWidth, minScale) {
    const initial = parseFloat(getComputedStyle(el).fontSize);
    let size = initial;
    let guard = 0;
    while (el.scrollWidth > maxWidth && size > initial * minScale && guard < 120) {
      size -= Math.max(0.5, initial * 0.005);
      el.style.fontSize = size + "px";
      guard += 1;
    }
  }
  document.fonts.ready.then(function () {
    fit(document.getElementById("title"), 720, 0.6);
    fit(document.getElementById("topName"), 420, 0.7);
    document.body.dataset.ready = "1";
  });
})();
</script>
</body>
</html>
