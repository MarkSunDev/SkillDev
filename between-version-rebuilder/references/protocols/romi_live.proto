syntax = "proto3";
package between.romi;
option swift_prefix = "RomiWire_";

// BuzzMe MatchCommon wire subset. TCP uses a 16-byte big-endian frame header.
message LiveHeartbeatRequest { // command 60001
  int32 index = 1;
  int32 status = 2; // 1 = online active, 2 = online inactive
  bool is_calling = 3;
}
message LiveHeartbeatResponse { // command 60002
  int32 index = 1;
}
message LiveTypingNotification { // command 60026
  int32 from_user_id = 1;
  int32 delay = 2; // >0: seconds; 0: stop; <0: ignore
}
