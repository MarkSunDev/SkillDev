syntax = "proto3";
package between.romi;
option swift_prefix = "RomiWire_";

// Wire contract from BuzzMe FeedProto / PostCommon / ReportPostProto.
message FeedPicture {
  string url = 1; int32 width = 2; int32 height = 3;
  string min_url = 4; int32 min_width = 5; int32 min_height = 6;
  string mid_url = 7; int32 mid_width = 8; int32 mid_height = 9;
  int32 state = 20;
}
message FeedPost {
  int64 id = 1; int32 author_id = 2; int32 like_count = 3;
  repeated FeedPicture pictures = 4; string content = 5; bool is_liked = 6;
  string author_avatar = 7; string author_name = 8; double score = 9;
  bool is_pinned = 10; int32 comment_count = 11; int64 banned_at = 12;
  int64 deleted_at = 13; int64 created_at = 14; int64 partial_banned_at = 15;
  int32 user_id = 16; bool is_digital_human = 17; string bot_id = 18;
}
message GetPostFeedRequest { int32 limit = 1; int64 offset = 2; }
message GetPostFeedResponse { int32 code = 1; string message = 2; repeated FeedPost posts = 3; int64 next_offset = 4; }
message FeedLikeRequest { int64 post_id = 1; int32 fake_user_id = 2; int32 duration = 3; }
message FeedLikeResponse { int32 code = 1; string message = 2; int32 like_count = 3; }
message CreatePostRequest { string client_token = 1; string content = 2; bool is_private = 4; }
message CreatePostResponse { int32 code = 1; int64 post_id = 2; string message = 3; FeedPost post = 4; }
message DeletePostRequest { int64 post_id = 1; }
message FeedActionResponse { int32 code = 1; string message = 2; }
message ReportPostRequest { int64 post_id = 1; repeated int32 reasons = 2; string description = 3; int32 author_id = 4; }
message GetVideoCallSwitchRequest { int32 to_user_id = 1; }
message GetVideoCallSwitchResponse { int32 code = 1; bool from_user_switch = 2; bool to_user_switch = 3; }
message SetVideoCallSwitchRequest { bool enabled = 1; int32 to_user_id = 2; }
message SetVideoCallSwitchResponse { int32 code = 1; string message = 2; bool enabled = 3; }

message GetPostsByUserIDRequest { int32 user_id = 1; int64 cursor = 2; int32 limit = 3; }
message GetPostsByUserIDResponse { int32 code = 1; string message = 2; repeated FeedPost posts = 3; int64 next_cursor = 4; }
