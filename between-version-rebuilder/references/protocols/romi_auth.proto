syntax = "proto3";
package between.romi;
option swift_prefix = "RomiWire_";

// Wire-compatible auth subset of HRUBaseModule 337af080 (AppStore/2.1.1).
// Numeric enum fields retain unknown values without importing unrelated SDK models.
message LoginUserRequest {
  string third_party_login_user_id = 1;
  int32 platform = 2; // ThirdPartyLoginUser.iOs = 1
  string device_id = 3;
}
message UserInfo {
  int32 user_id = 1;
  string avatar_url = 2;
  string username = 3;
  string bio = 4;
  int32 age = 5;
  int32 gender = 6;
  string nickname = 8;
  int32 user_status = 10;
  bool pending = 12;
  string profession = 14;
  ContactGeoLocation geo_location = 15;
  ContactProfileImage custom_avatar = 17; // BuzzMe ownface / PictureInQuery
  repeated ContactInterestTab interest_tabs = 20;
  ContactProfileImage profile_image = 22;
  bool is_online = 21;
  string tim_usersig = 30;
  string beautified_avatar = 31; // BuzzMe prettyface
  string education = 25;
  string phone_number = 27;
  bool face_verified = 36;
  int32 height = 39;
  string birthday = 40;
}
message LoginUserResponse {
  bool is_new_user = 1;
  GetUserInfoResponse userinfo = 2;
  string token = 3;
  string tim_usersig = 4;
  int32 post_login_action = 5;
  int32 code = 6;
  int64 next_token_refresh_time = 7;
  int32 balance = 10;
}
message RefreshTokenRequest {}
message RefreshTokenResponse {
  string token = 1;
  string tim_usersig = 2;
  int64 next_token_refresh_time = 3;
  int32 code = 4;
}

// Read-only business APIs, using the same authenticated HTTP framing.
message GetClientConfigRequest {}
message GetClientConfigResponse {
  string client_config = 1; // JSON object
}
message GetUserInfoRequest {
  int32 user_id = 1;
}
message GetUserInfoResponse {
  int32 user_id = 1;
  string avatar_img_url = 3;
  string username = 4;
  bool is_online = 5;
  string regulation_status = 7;
  string bio = 9;
  int32 gender = 12;
  int32 code = 14;
  int64 deleted_at = 17;
  string nickname = 18;
}

// BuzzMe 1.3.0/develop 1557e83 (AccountProto / UserCommon).
message FastLoginRequest {
  string device_id = 1;
  int32 user_id = 2;
  string third_party_login_user_id = 3;
  int32 platform = 4;
  string email = 8;
}
message FastLoginResponse {
  UserInfo user_info = 1;
  string token = 3;
  int32 code = 5;
  int64 next_token_refresh_time = 6;
}
message GetUserBasicInfosV2Request {
  repeated int32 user_ids = 1;
  bool with_online_info = 2;
}
message GetUserBasicInfosV2Response {
  int32 code = 1;
  string message = 2;
  repeated UserInfo user_basic_infos = 3;
}

// Pending-account completion only, not a partial edit of an existing profile.
// Subset used by BuzzMe RegistrationDraft (no attribution/location collection).
message UploadUserInfoRequest {
  string username = 1;
  int32 age = 2;
  int32 gender = 6;
  string bio = 8;
  string referral_code = 10;
}
message UploadUserInfoResponse {
  UserInfo user_info = 1;
  int32 code = 2;
  string message = 3;
}

// Apple registration, distinct from FastLogin's pending-account completion.
message CreateUserRequest {
  string third_party_login_user_id = 1;
  int32 platform = 2;
  string username = 3;
  int32 age = 5;
  int32 gender = 9;
  string bio = 11;
  string device_id = 12;
}
message CreateUserResponse {
  bool creation_successful = 1;
  int32 user_id = 2;
  string token = 3;
  string regulation_status = 6;
  int32 code = 8;
  int64 next_token_refresh_time = 10;
}

// Ordinary authenticated user moderation. Intentionally excludes from_user_id
// and delayTime: the server must take the actor from the Bearer session.
message BlockHumanChatUserRequest { int32 target_user_id = 1; }
message BlockHumanChatUserResponse { int32 code = 1; string message = 2; }
message UnblockHumanChatUserRequest { int32 target_user_id = 1; }
message UnblockHumanChatUserResponse { int32 code = 1; string message = 2; }
message GetHumanChatUserBlockListRequest { int32 limit = 1; int32 offset_id = 2; }
message GetHumanChatUserBlockListResponse {
  repeated UserBlockListItem users = 1;
  int32 code = 2;
  string message = 3;
}
message UserBlockListItem {
  int32 id = 1;
  int32 user_id = 2;
  int32 target_id = 3;
  int64 created_at = 4;
  UserInfo target_user = 5;
}
message ReportHumanChatUserRequest {
  int32 target_user_id = 1;
  string content = 2;
  int32 reason = 3;
}
message ReportHumanChatUserResponse {
  repeated int32 reason = 1;
  int32 code = 2;
  string message = 3;
}

// Public card fields, wire-checked against BuzzMe UserCommon.pb.swift.
message ContactGeoLocation {
  string country = 3;
  string region = 4;
  string province = 5;
  string city = 6;
  string zip_code = 7;
  double longitude = 8;
  double latitude = 9;
}
// Wire-compatible PictureInQuery, including the variants used by userAvatarString().
message ContactProfileImage {
  string url = 1;
  int32 width = 2;
  int32 height = 3;
  string min_url = 4;
  int32 min_width = 5;
  int32 min_height = 6;
  string mid_url = 7;
  int32 mid_width = 8;
  int32 mid_height = 9;
  int32 state = 20;
}
message ContactInterestTab { string key = 1; int32 sort_key = 2; repeated ContactInterestTag tags = 3; }
message ContactInterestTag { string key = 1; int32 sort_key = 2; }

// BuzzMe new-user entitlement bootstrap, ordinary authenticated user only.
message GetEntitlementStatusRequest {}
message GetEntitlementStatusResponse {
  int32 code = 1;
  string message = 2;
  repeated EntitlementStatusInfo entitlements = 3;
}
message EntitlementStatusInfo { int32 kind = 1; bool claimed = 2; int32 left = 3; }
message ClaimEntitlementRequest { int32 kind = 1; }
message ClaimEntitlementResponse { int32 code = 1; string message = 2; int64 left_coin = 3; }

// Full replacement: preserve current fields when editing only the display name.
message EditProfileRequest {
  string bio = 1; int32 age = 2; int32 gender = 3;
  repeated ContactInterestTab interests = 4;
  string nickname = 5; string username = 6;
  string profession = 7; string education = 8; ContactGeoLocation location = 9;
  string phone_number = 10; bool face_verified = 11; int32 height = 12; string birthday = 13;
}
message EditProfileResponse { int32 code = 1; }
